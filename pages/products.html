<body
  data-page="products"
  class="bg-white text-[#181818] antialiased"
>

  <!-- ==========================================
       NAVBAR
  =========================================== -->

  <div
    id="navbar-container"
    data-theme="light"
  ></div>

  <main>

 <div id="heroContainer"></div>

<div id="productsIntroduction"></div>















<!-- ==========================================
     BROCHURE DOWNLOAD SECTION
========================================== -->

<section
  id="brochureSection"
  class="
    relative
    overflow-hidden
    bg-[#181818]
    py-20
    md:py-24
    lg:py-28
  "
>

  <!-- ==========================================
       DECORATIVE BACKGROUND
  ========================================== -->

  <div
    class="
      pointer-events-none
      absolute
      -right-32
      -top-32
      h-96
      w-96
      rounded-full
      border
      border-[#E8720F]/10
    "
  ></div>

  <div
    class="
      pointer-events-none
      absolute
      -bottom-40
      -left-40
      h-96
      w-96
      rounded-full
      border
      border-[#E8720F]/10
    "
  ></div>


  <!-- ==========================================
       CONTAINER
  ========================================== -->

  <div
    class="
      relative
      mx-auto
      max-w-7xl
      px-6
      lg:px-8
    "
  >

    <div
      class="
        grid
        items-center
        gap-12
        lg:grid-cols-[1.15fr_0.85fr]
        lg:gap-20
      "
    >


      <!-- ==========================================
           LEFT CONTENT
      ========================================== -->

      <div
        class="
          max-w-3xl
        "
      >

        <!-- Eyebrow -->

        <p
          class="
            mb-4
            text-xs
            font-semibold
            uppercase
            tracking-[0.25em]
            text-[#E8720F]
          "
        >
          Company Brochure
        </p>


        <!-- Heading -->

        <h2
          class="
            font-['Playfair_Display']
            text-3xl
            font-semibold
            leading-tight
            text-white
            sm:text-4xl
            lg:text-5xl
          "
        >
          Discover
          <span class="text-[#E8720F]">
            Reis Agri Trading
          </span>
        </h2>


        <!-- Description -->

        <p
          class="
            mt-5
            max-w-2xl
            text-base
            leading-7
            text-white/65
            md:text-lg
            md:leading-8
          "
        >
          Explore our company profile, agricultural commodities,
          sourcing capabilities, quality standards and global
          trading expertise in our detailed brochure.
        </p>


        <!-- ==========================================
             BUTTONS
        ========================================== -->

        <div
          class="
            mt-8
            flex
            flex-wrap
            gap-4
          "
        >

          <!-- Download Brochure -->

          <a
            href="/src/assets/REISAGRI_Brochure.pdf"
            download
            class="
              group
              inline-flex
              items-center
              gap-3
              rounded-full
              bg-[#E8720F]
              px-7
              py-3.5
              text-sm
              font-semibold
              text-white
              transition-all
              duration-300
              hover:-translate-y-0.5
              hover:bg-[#f58220]
              hover:shadow-[0_12px_30px_rgba(232,114,15,0.25)]
            "
          >

            <i
              data-lucide="download"
              class="
                h-4
                w-4
                transition-transform
                duration-300
                group-hover:translate-y-0.5
              "
            ></i>

            <span>
              Download Brochure
            </span>

          </a>


          <!-- View Brochure -->

          <a
            href="/src/assets/REISAGRI_Brochure.pdf"
            target="_blank"
            rel="noopener noreferrer"
            class="
              group
              inline-flex
              items-center
              gap-3
              rounded-full
              border
              border-white/15
              px-7
              py-3.5
              text-sm
              font-medium
              text-white
              transition-all
              duration-300
              hover:border-[#E8720F]
              hover:text-[#E8720F]
            "
          >

            <i
              data-lucide="file-text"
              class="
                h-4
                w-4
                transition-transform
                duration-300
                group-hover:scale-105
              "
            ></i>

            <span>
              View Brochure
            </span>

          </a>

        </div>

      </div>


      <!-- ==========================================
           RIGHT BROCHURE IMAGE
      ========================================== -->

      <div
        class="
          relative
          mx-auto
          w-full
          max-w-sm
          lg:max-w-md
        "
      >

        <!-- Orange Outer Frame -->

        <div
          class="
            absolute
            -inset-4
            rounded-2xl
            border
            border-[#E8720F]/10
          "
        ></div>


        <!-- Image Container -->

        <div
          class="
            relative
            overflow-hidden
            rounded-2xl
            border
            border-white/10
            bg-white/[0.04]
            shadow-[0_25px_70px_rgba(0,0,0,0.35)]
          "
        >

          <img
            src="/src/assets/images/basmati-mobile.webp"
            alt="Reis Agri Trading Brochure"
            loading="lazy"
            class="
              block
              h-auto
              w-full
              object-cover
              transition-transform
              duration-700
              hover:scale-[1.02]
            "
          />

        </div>

      </div>

    </div>

  </div>

</section>
