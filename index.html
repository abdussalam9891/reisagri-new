 <!DOCTYPE html>
<html lang="en">

<head>

  <!-- ========================================= -->
  <!-- Basic Meta -->
  <!-- ========================================= -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    REISAGRI | Global Agricultural Commodity Exporter
  </title>

  <meta
    name="description"
    content="REISAGRI is a trusted exporter of premium agricultural commodities including rice, sugar, spices, grains, pulses and maize, connecting producers with buyers across global markets."
  />

  <meta
    name="keywords"
    content="REISAGRI, Agricultural Export, Commodity Trading, Rice Exporter, Sugar Exporter, Global Sourcing, African Market"
  />

  <meta
    name="author"
    content="REISAGRI"
  />

  <meta
    name="robots"
    content="index,follow"
  />

  <meta
    name="theme-color"
    content="#181818"
  />

  <!-- ========================================= -->
  <!-- Open Graph -->
  <!-- ========================================= -->

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="REISAGRI | Global Agricultural Commodity Exporter"
  />

  <meta
    property="og:description"
    content="Connecting trusted producers with buyers worldwide through reliable sourcing and agricultural commodity exports."
  />

  <meta
    property="og:image"
    content="/assets/images/og-image.jpg"
  />

  <meta
    property="og:url"
    content="https://reisagri.com"
  />

  <!-- ========================================= -->
  <!-- Twitter -->
  <!-- ========================================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="REISAGRI"
  />

  <meta
    name="twitter:description"
    content="Global Agricultural Commodity Exporter."
  />

  <!-- ========================================= -->
  <!-- Canonical -->
  <!-- ========================================= -->

  <link
    rel="canonical"
    href="https://reisagri.com"
  />

  <!-- ========================================= -->
  <!-- Favicon -->
  <!-- ========================================= -->

  <link
    rel="icon"
    href="/favicon.ico"
  />

  <!-- ========================================= -->
  <!-- Google Fonts -->
  <!-- ========================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- ========================================= -->
  <!-- Main CSS -->
  <!-- ========================================= -->

  <link
    rel="stylesheet"
    href="/src/css/main.css"
  />

  <!-- ========================================= -->
  <!-- Tailwind -->
  <!-- ========================================= -->

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#E8720F",
            forest: "#181818",
            background: "#F7F5F2",
            surface: "#FFFFFF",
          },

          fontFamily: {
            sans: ["Inter", "sans-serif"],
            serif: ["Playfair Display", "serif"],
          },
        },
      },
    };
  </script>

</head>

  <div class="mx-auto max-w-7xl px-6 lg:px-8">

    <div class="mx-auto max-w-3xl text-center">

        class="
          mt-4

          mx-auto

      id="faqContainer"

        mx-auto
        mt-16
        max-w-4xl
        space-y-5

  </div>

</section>

    <!-- ========================================= -->

 <!-- ========================================= -->
<!-- Contact CTA -->

<section id="contactCTA"></section>

<!-- ========================================= -->

<!-- ========================================= -->

<div id="footer"></div>

</html>
