<body
data-page="home"
  class="
    min-h-screen
    bg-white
    font-sans
    text-[#222222]
    antialiased
  "
>

  <!-- ========================================= -->
  <!-- Navbar -->
  <!-- ========================================= -->

  <div
    id="navbar-container"
    data-theme="light"
  ></div>

  <!-- ========================================= -->
  <!-- Main -->
  <!-- ========================================= -->

  <main>



    <!-- ========================================= -->
<!-- HERO -->
<!-- ========================================= -->

<section
  id="hero"

  class="
    relative

    h-[68svh]

    min-h-[560px]
    max-h-[820px]

    overflow-hidden

    md:h-[65vh]
    lg:h-[72vh]
    xl:h-[76vh]
  "
>

  <!-- ========================================= -->
  <!-- FIRST / LCP HERO SLIDE -->
  <!-- ========================================= -->

  <div
    class="
      hero-slide

      absolute
      inset-0

      overflow-hidden

      opacity-100
      z-20
    "

    data-slide="0"
  >

    <picture>

      <!-- Mobile LCP Image -->

      <source
        media="(max-width: 768px)"
        srcset="/src/assets/images/2-mobile.webp"
      />

      <!-- Desktop LCP Image -->

      <img
        src="/src/assets/images/2.webp"

        alt="Premium agricultural commodities"

        width="1920"
        height="1080"

        loading="eager"

        fetchpriority="high"

        decoding="async"

        draggable="false"

        class="
          hero-image

          absolute
          inset-0

          h-full
          w-full

          object-cover

          select-none
        "
      />

    </picture>


    <!-- Left Gradient -->

    <div
      class="
        pointer-events-none

        absolute
        inset-0

        bg-[linear-gradient(90deg,rgba(0,0,0,.82)_0%,rgba(18,18,18,.62)_35%,rgba(232,114,15,.12)_100%)]
      "
    ></div>


    <!-- Bottom Fade -->

    <div
      class="
        pointer-events-none

        absolute
        inset-x-0
        bottom-0

        h-48

        md:h-40

        bg-gradient-to-t
        from-black/80
        via-black/35
        to-transparent
      "
    ></div>

  </div>


  <!-- ========================================= -->
  <!-- JS WILL INSERT SLIDES 2–4 HERE -->
  <!-- ========================================= -->

  <div id="heroDynamicSlides"></div>


  <!-- ========================================= -->
  <!-- JS HERO CONTENT -->
  <!-- ========================================= -->

  <div id="heroContent"></div>


  <!-- ========================================= -->
  <!-- JS INDICATORS -->
  <!-- ========================================= -->

  <div id="heroIndicators"></div>


  <!-- ========================================= -->
  <!-- PREVIOUS -->
  <!-- ========================================= -->

  <button
    id="heroPrev"

    type="button"

    aria-label="Previous Slide"

    class="
      absolute

      left-5
      lg:left-6

      top-1/2

      z-40

      hidden
      lg:flex

      h-12
      w-12

      xl:h-14
      xl:w-14

      -translate-y-1/2

      items-center
      justify-center

      rounded-full

      border
      border-white/20

      bg-black/20

      text-white

      backdrop-blur-md

      transition-all
      duration-300

      hover:scale-110

      hover:border-[#E8720F]

      hover:bg-black/40
    "
  >

    <svg
      xmlns="http://www.w3.org/2000/svg"

      class="h-5 w-5 xl:h-6 xl:w-6"

      fill="none"

      viewBox="0 0 24 24"

      stroke="currentColor"

      stroke-width="2"
    >

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 19l-7-7 7-7"
      />

    </svg>

  </button>


  <!-- ========================================= -->
  <!-- NEXT -->
  <!-- ========================================= -->

  <button
    id="heroNext"

    type="button"

    aria-label="Next Slide"

    class="
      absolute

      right-5
      lg:right-6

      top-1/2

      z-40

      hidden
      lg:flex

      h-12
      w-12

      xl:h-14
      xl:w-14

      -translate-y-1/2

      items-center
      justify-center

      rounded-full

      border
      border-white/20

      bg-black/20

      text-white

      backdrop-blur-md

      transition-all
      duration-300

      hover:scale-110

      hover:border-[#E8720F]

      hover:bg-black/40
    "
  >

    <svg
      xmlns="http://www.w3.org/2000/svg"

      class="h-5 w-5 xl:h-6 xl:w-6"

      fill="none"

      viewBox="0 0 24 24"

      stroke="currentColor"

      stroke-width="2"
    >

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M9 5l7 7-7 7"
      />

    </svg>

  </button>


  <!-- ========================================= -->
  <!-- BOTTOM FADE -->
  <!-- ========================================= -->

  <div
    class="
      pointer-events-none

      absolute
      inset-x-0
      bottom-0

      z-20

      h-32

      md:h-40

      bg-gradient-to-t
      from-black/80
      via-black/35
      to-transparent
    "
  ></div>

</section>
